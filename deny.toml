# cargo-deny policy — license allowlist/denylist, advisories, bans, sources.
# See AI.md PART 11 -> "License Compliance" for the policy this encodes.

[graph]
targets = [
  { triple = "x86_64-unknown-linux-musl" },
  { triple = "aarch64-unknown-linux-musl" },
]

[advisories]
version = 2
yanked  = "deny"

[licenses]
version = "2"
allow = [
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["OpenSSL"]
name  = "ring"

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny = [
  { name = "openssl-sys" },
  { name = "openssl" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git       = "deny"
allow-registry    = ["https://github.com/rust-lang/crates.io-index"]
