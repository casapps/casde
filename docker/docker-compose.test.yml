name: casde-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

networks:
  casde-test:
    driver: bridge

services:
  test:
    image: casjaysdev/rust:latest
    working_dir: /work
    networks:
      - casde-test
    environment:
      GOFLAGS: -buildvcs=false
      CI: "true"
    volumes:
      - ${PWD}:/work
    command: ["cargo", "test", "--workspace", "--all-features"]
    logging: *default-logging
