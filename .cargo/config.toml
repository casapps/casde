# CASDE targets Linux and BSD only (IDEA.md "Platform targets") — no
# Windows/macOS entries; those platforms don't have a meaningful desktop
# environment use case for this project.

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
